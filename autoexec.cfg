// **********************************
// * Normal key bind
// **********************************
binddefaults
con_enable "1"
spec_replay_autostart "1"
cl_dm_buyrandomweapons "0"
engine_no_focus_sleep "0"
bind "MOUSE5" "+voicerecord"
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"
bind "Capslock" "slot3; slot7"

// **********************************
// * Alias command
// **********************************
alias "at" "exec autoexec.cfg"
alias "dc" "disconnect"
alias "qt" "quit"
alias "rl" "mp_restartgame 1"

// **********************************
// * Load Practice mode: "pt"
// **********************************
alias "stop_nade_1" "ent_fire smokegrenade_projectile kill; ent_fire molotov_projectile kill; ent_fire flashbang_projectile kill"
alias "stop_nade_2" "ent_fire hegrenade_projectile kill; ent_fire decoy_projectile kill; ent_fire inferno kill; stopsound"
alias "stop_nade" "stop_nade_1; stop_nade_2; echo --- nades cleared"

alias "spawn_bot" "bot_add_ct; bot_stop 1; bot_place; echo --- bot spawned"

alias "savepos" "getpos; echo ---; echo --- alias telepos_go YOUR_SETPOS_HERE; echo ---"
alias "telepos_go" "setpos_exact 0 0 0; setang 0 0 0"
alias "telepos" "noclip; telepos_go; noclip; echo --- teleported"

alias "en_trajectory" "sv_grenade_trajectory_prac_pipreview 1; sv_grenade_trajectory_prac_trailtime 15; bind ] dis_trajectory"
alias "dis_trajectory" "sv_grenade_trajectory_prac_pipreview 0; sv_grenade_trajectory_prac_trailtime 0; bind ] en_trajectory"
alias "pt_1" "sv_cheats 1; mp_forcecamera 0; mp_limitteams 10; mp_autoteambalance 0; mp_spectators_max 10; mp_round_restart_delay 2"
alias "pt_2" "mp_roundtime 60; mp_roundtime_defuse 60; mp_roundtime_hostage 60; mp_maxmoney 60000; mp_startmoney 60000"
alias "pt_3" "mp_freezetime 0; mp_buytime 9999; mp_buy_anywhere 1; sv_infinite_ammo 2; ammo_grenade_limit_total 5"
alias "pt_4" "bot_allow_machine_guns 0; bot_allow_shotguns 0; bot_allow_sub_machine_guns 0; bot_kick; mp_warmup_end; mp_restartgame 1"
alias "pt_5" "bind ALT noclip; bind END stop_nade; bind \ sv_rethrow_last_grenade; bind [ toggle sv_showimpacts 1 0; bind ] en_trajectory"
alias "pt_6" "bind F5 spawn_bot; bind F6 savepos; bind F7 telepos"
alias "pt" "pt_1; pt_2; pt_3; pt_4; pt_5; pt_6; echo --- pt mode loaded"

// **********************************
// * Voice setting: "PGUP"
// **********************************
alias "mt" "voice_modenable 0; bot_chatter off; echo --- mic off"
alias "um" "voice_modenable 1; bot_chatter normal; echo --- mic on"
alias "setmute" "mt; bind PGUP setunmute"
alias "setunmute" "um; bind PGUP setmute"
bind PGUP setmute

// **********************************
// * Volume mode: "PGDN"
// *  - 0: no sound
// *  - 1: no music
// *  - 2: default (starts here, first press goes to 0)
// **********************************
alias "v0" "volume 0; echo --- vol 0"
alias "v1_1" "volume 1; snd_deathcamera_volume 0; snd_menumusic_volume 0; snd_mvp_volume 0"
alias "v1_2" "snd_roundend_volume 0; snd_roundstart_volume 0; snd_mapobjective_volume 0"
alias "v1" "v1_1; v1_2; echo --- vol 1"
alias "v2_1" "volume 1; snd_deathcamera_volume 0.16; snd_menumusic_volume 0.04; snd_mvp_volume 0.16"
alias "v2_2" "snd_roundend_volume 0.16; snd_roundstart_volume 0.16; snd_mapobjective_volume 0.04"
alias "v2" "v2_1; v2_2; echo --- vol 2"
alias "setvol0" "v0; bind PGDN setvol1"
alias "setvol1" "v1; bind PGDN setvol2"
alias "setvol2" "v2; bind PGDN setvol0"
bind PGDN setvol2

// **********************************
// * CrossHair setting: "/"
// **********************************
cl_crosshair_recoil "0"
alias "style1_1" "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshairdot 0; cl_crosshair_t 0; cl_crosshairgap -3"
alias "style1_2" "cl_crosshairsize 1.5; cl_crosshairstyle 4; cl_crosshairusealpha 1"
alias "style1_3" "cl_crosshairthickness 1; cl_crosshair_outlinethickness 1; cl_crosshair_drawoutline 1"
alias "style1_4" "cl_crosshair_dynamic_maxdist_splitratio 1; cl_crosshair_dynamic_splitalpha_innermod 1"
alias "style1_5" "cl_crosshair_dynamic_splitdist 16; cl_crosshair_sniper_width 1; cl_crosshair_dynamic_splitalpha_outermod 1"
alias "style1_6" "cl_crosshaircolor_b 0; cl_crosshaircolor_g 255; cl_crosshaircolor_r 155; cl_crosshairgap_useweaponvalue 0"
alias "c1" "style1_1; style1_2; style1_3; style1_4; style1_5; style1_6; echo --- xhair 1"

alias "style2_1" "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshairdot 0; cl_crosshair_t 0; cl_crosshairgap -4"
alias "style2_2" "cl_crosshairsize 1; cl_crosshairstyle 4; cl_crosshairusealpha 1"
alias "style2_3" "cl_crosshairthickness 1; cl_crosshair_outlinethickness 0; cl_crosshair_drawoutline 0"
alias "style2_4" "cl_crosshair_dynamic_maxdist_splitratio 0.3; cl_crosshair_dynamic_splitalpha_innermod 1"
alias "style2_5" "cl_crosshair_dynamic_splitdist 7; cl_crosshair_sniper_width 1; cl_crosshair_dynamic_splitalpha_outermod 0.5"
alias "style2_6" "cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairgap_useweaponvalue 0"
alias "c2" "style2_1; style2_2; style2_3; style2_4; style2_5; style2_6; echo --- xhair 2"

alias "style3_1" "cl_crosshairalpha 200; cl_crosshaircolor 2; cl_crosshairdot 0; cl_crosshair_t 0; cl_crosshairgap -1"
alias "style3_2" "cl_crosshairsize 3; cl_crosshairstyle 4; cl_crosshairusealpha 1"
alias "style3_3" "cl_crosshairthickness 1; cl_crosshair_outlinethickness 1; cl_crosshair_drawoutline 1"
alias "style3_4" "cl_crosshair_dynamic_maxdist_splitratio 0.4; cl_crosshair_dynamic_splitalpha_innermod 1"
alias "style3_5" "cl_crosshair_dynamic_splitdist 7; cl_crosshair_sniper_width 2; cl_crosshair_dynamic_splitalpha_outermod 0.5"
alias "style3_6" "cl_crosshaircolor_b 255; cl_crosshaircolor_g 255; cl_crosshaircolor_r 255; cl_crosshairgap_useweaponvalue 0"
alias "c3" "style3_1; style3_2; style3_3; style3_4; style3_5; style3_6; echo --- xhair 3"

alias "style4_1" "cl_crosshairalpha 255; cl_crosshaircolor 5; cl_crosshairdot 1; cl_crosshair_t 0; cl_crosshairgap 9999"
alias "style4_2" "cl_crosshairsize 0.5; cl_crosshairstyle 4; cl_crosshairusealpha 1"
alias "style4_3" "cl_crosshairthickness 1; cl_crosshair_outlinethickness 1; cl_crosshair_drawoutline 1"
alias "style4_4" "cl_crosshair_dynamic_maxdist_splitratio 0.4; cl_crosshair_dynamic_splitalpha_innermod 1"
alias "style4_5" "cl_crosshair_dynamic_splitdist 7; cl_crosshair_sniper_width 2; cl_crosshair_dynamic_splitalpha_outermod 0.5"
alias "style4_6" "cl_crosshaircolor_b 255; cl_crosshaircolor_g 0; cl_crosshaircolor_r 195; cl_crosshairgap_useweaponvalue 0"
alias "c4" "style4_1; style4_2; style4_3; style4_4; style4_5; style4_6; echo --- xhair 4"

alias "setchr1" "c1; bind / setchr2"
alias "setchr2" "c2; bind / setchr3"
alias "setchr3" "c3; bind / setchr4"
alias "setchr4" "c4; bind / setchr1"
bind / setchr3

// **********************************
// * Radar
// **********************************
cl_radar_square_always "1"
cl_radar_icon_scale_min "0.8"
cl_hud_radar_scale "0.95"

// **********************************
// * Combine key: "Mouse4" + "Q/E/F"
// *  - Q: molly
// *  - E: nade
// *  - F: smoke
// * Advanced Bind Script - by Maxim aka BananaGaming
// **********************************
alias defE      "bind e +use"
alias defF      "bind f +lookatweapon"
alias defQ      "bind q lastinv"
alias keyE      "bind e customE"
alias keyF      "bind f customF"
alias keyQ      "bind q customQ"
alias customE   "slot6"
alias customF   "slot8"
alias customQ   "slot10"
alias +keybinds "keyE; keyF; keyQ"
alias -keybinds "defE; defF; defQ; -lookatweapon; -use"
bind "MOUSE4" "+keybinds"

echo **********************************
